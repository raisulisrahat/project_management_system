{% load static %}
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" type="text/css">
    <script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
<div class="container-fluid">
    <!-- Logo Section -->
    <a class="text-decoration-none text-secondary-emphasis" href="{% url 'dashboard' %}">
        <div class="d-flex gap-2">
            <img src="{% static 'image/Flowtrex-icon.png' %}" alt="Flowtrex" height="30">
            <span class="fw-bold align-content-center fs-5">Flowtrex</span>
        </div>
    </a>

    <!-- Navbar Toggle for Mobile -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Content -->
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <div class="navbar-nav d-flex align-items-center gap-3">
            <!-- Search Box -->
            <div class="nav-item">
                <form id="search-form" class="d-flex align-items-center position-relative">
                    <i class="fa fa-search position-absolute top-50 translate-middle-y" style="left: 10px;"></i>
                    <input type="text" id="search_input" class="form-control border-1 form-input shadow-sm" style="text-indent: 30px;" placeholder=" Search "/>
                </form>
                <div id="search-results"></div>
            </div>
            <!-- Notifications Icon -->
            <div class="nav-item mt-1">
                <a class="nav-link" href="{% url 'dashboard' %}">
                    <i class="fas fa-bell fs-5"></i>
                </a>
            </div>
            <!-- User Profile and Dropdown -->
            <div class="nav-item dropdown">
                {% if user.is_authenticated %}
                <div class="nav-link dropdown-toggle" id="profileDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="{{ user.profile.profile_image.url }}" alt="{{ user.profile.full_name }}" class="rounded-circle" height="38px" width="38px">
                </div>
                <ul class="dropdown-menu p-2 dropdown-menu-end" style="min-width: 250px;" aria-labelledby="profileDropdown">
                    <li>
                        <div class="d-flex justify-content-between align-items-center gap-3 py-2 ms-2 mb-3">
                            <img src="{{ user.profile.profile_image.url }}" alt="{{ user.profile.full_name }}" class="rounded" height="38px" width="38px">
                            <div class="flex-column">
                                <span class="eme01">{{ user.profile.full_name }}</span>
                                <span class="eme02 text-black-50">{{ user.email }}</span>
                            </div>
                        </div>
                    </li>
                    <li>
                        <a class="ms-3 text-decoration-none text-dark" href="{% url 'profile' user.profile.id %}">
                            <i class="fa-solid fa-user" aria-hidden="true"></i>
                            <span class="ms-2">Profile Details</span>
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="ms-3 text-decoration-none text-dark" href="{% url 'settings' %}">
                            <i class="fa-solid fa-gear" aria-hidden="true"></i>
                            <span class="ms-1">Settings</span>
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="ms-3 text-decoration-none text-dark" href="{% url 'logout' %}">
                            <i class="fa fa-sign-out" aria-hidden="true"></i>
                            <span class="ms-2">Logout</span>
                        </a>
                    </li>
                </ul>
                {% endif %}
            </div>
        </div>
    </div>
</div>
<script>
$(document).ready(function () {
    $('#search_input').on('keyup', function () {  // also fixed the input ID here
        const query = $(this).val();

        if (query.length > 2) {
            $.ajax({
                url: `/search/`,
                data: { q: query },
                dataType: 'json',
                success: function (data) {
                    const $results = $('#search-results');
                    $results.empty();

                    if (data.results) {
                        const { projects, tasks, issues, departments } = data.results;

                        // Projects
                        if (projects.length > 0) {
                            $results.append('<h6>Projects</h6><ul class="list-group">');
                            $.each(projects, function (i, project) {
                                $results.append(`<li class="list-group-item">${project.title} (${project.label})</li>`);
                            });
                            $results.append('</ul>');
                        }

                        // Tasks
                        if (tasks.length > 0) {
                            $results.append('<h6>Tasks</h6><ul class="list-group">');
                            $.each(tasks, function (i, task) {
                                $results.append(`<li class="list-group-item">${task.summary} (${task.unique_id})</li>`);
                            });
                            $results.append('</ul>');
                        }

                        // Issues
                        if (issues.length > 0) {
                            $results.append('<h6>Issues</h6><ul class="list-group">');
                            $.each(issues, function (i, issue) {
                                $results.append(`<li class="list-group-item">${issue.title}</li>`);
                            });
                            $results.append('</ul>');
                        }

                        // Departments
                        if (departments.length > 0) {
                            $results.append('<h6>Departments</h6><ul class="list-group">');
                            $.each(departments, function (i, department) {
                                $results.append(`<li class="list-group-item">${department.department_name}</li>`);
                            });
                            $results.append('</ul>');
                        }

                        if (
                            projects.length === 0 &&
                            tasks.length === 0 &&
                            issues.length === 0 &&
                            departments.length === 0
                        ) {
                            $results.append('<p>No results found.</p>');
                        }
                    } else {
                        $results.append('<p>No results found.</p>');
                    }
                }
            });
        } else {
            $('#search-results').empty();
        }
    });
});

</script>
