{% extends 'base.html' %}
{% load static %}

{% block title %}Create Project{% endblock %}

{% block content %}
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
        {{ form.as_p }}
        {{ form.media }}
    </div>

    <!-- Submit Button -->
    <input type="submit" value="Submit" href="{% url 'projects' %}">
</form>
{% endblock %}
