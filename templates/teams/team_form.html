{% extends 'base.html' %}
{% load static %}

{% block title %}Create Project{% endblock %}

{% block content %}
<div class="container">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
            <div class="col-md-5">
                <div class="form-group my-sm-2 col-sm-4">
                    <label class="mb-sm-1">Team Name</label>
                    <input type="text" class="form-control" name="name" placeholder="Team Name">
                </div>
                <div class="form-group my-sm-2">
                    <label  class="mb-sm-1">Team Description</label>
                    {{ form.about_info }}  <!-- Uses CKEditor automatically -->
                </div>
                <div class="form-group col-sm-5">
                    <label class="mb-sm-1">Members</label>
                    <select class="form-select form-multi-select" name="user_id" multiple data-live-search="true">
                        {% for user in users %}
                            <option class="checkbox-row" value="{{ user.id }}">{{ user.profile.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Create Team</button>
            </div>
        </div>
    </form>
</div>

{{ form.media }}

{% endblock %}
