{% load static %}
{# The main container for the navigation bar, styled as a card #}
<div class="my-4 bg-white rounded-lg shadow-md">
    <nav class="flex flex-wrap items-center divide-x divide-gray-200">

        {# Each link is now a flex item with consistent padding, styles, and hover effects #}
        <a href="{% url 'project_detail' project.label %}" class="flex flex-grow items-center justify-center gap-2 px-4 py-3 text-sm font-medium transition-colors duration-150
            {% if request.resolver_match.url_name == 'project_detail' %}
                bg-cyan-50 text-cyan-700
            {% else %}
                text-gray-600 hover:bg-gray-100
            {% endif %}">
            <i class="bi-layout-wtf text-base"></i>
            <span>Summary</span>
        </a>

        <a href="{% url 'task_lists' project.label %}" class="flex flex-grow items-center justify-center gap-2 px-4 py-3 text-sm font-medium transition-colors duration-150
            {% if request.resolver_match.url_name == 'task_lists' %}
                bg-cyan-50 text-cyan-700
            {% else %}
                text-gray-600 hover:bg-gray-100
            {% endif %}">
            <i class="bi-card-list text-base"></i>
            <span>Lists</span>
        </a>

        <a href="{% url 'kanban_board' project.label %}" class="flex flex-grow items-center justify-center gap-2 px-4 py-3 text-sm font-medium transition-colors duration-150
            {% if request.resolver_match.url_name == 'kanban_board' %}
                bg-cyan-50 text-cyan-700
            {% else %}
                text-gray-600 hover:bg-gray-100
            {% endif %}">
            <i class="bi-kanban text-base"></i>
            <span>Board</span>
        </a>

        <a href="{% url 'calendar_view' project.label %}" class="flex flex-grow items-center justify-center gap-2 px-4 py-3 text-sm font-medium transition-colors duration-150
            {% if request.resolver_match.url_name == 'calendar_view' %}
                bg-cyan-50 text-cyan-700
            {% else %}
                text-gray-600 hover:bg-gray-100
            {% endif %}">
            <i class="bi-calendar text-base"></i>
            <span>Calendar</span>
        </a>

        <a href="{% url 'backlog' project.label %}" class="flex flex-grow items-center justify-center gap-2 px-4 py-3 text-sm font-medium transition-colors duration-150
            {% if request.resolver_match.url_name == 'backlog' %}
                bg-cyan-50 text-cyan-700
            {% else %}
                text-gray-600 hover:bg-gray-100
            {% endif %}">
            <i class="bi-list-nested text-base"></i>
            <span>Backlog</span>
        </a>

    </nav>
</div>
