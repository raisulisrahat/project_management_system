{% extends 'base.html' %}
{% load static %}

{% block title %}Select Project{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Select a Project</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            {{ form.project.label_tag }}
            {{ form.project }}
        </div>
        <div class="form-group mt-3">
            <input type="submit" value="View Tasks" class="btn btn-primary">
        </div>
    </form>
</div>
{% endblock %}
