<div id="calendar" style="height: 800px;"></div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const Calendar = toastui.Calendar;

    const calendar = new Calendar('#calendar', {
      defaultView: 'month',
      taskView: true,
      scheduleView: ['time'],
      useDetailPopup: true,
      useFormPopup: false,
      calendars: [
        {
          id: '1',
          name: 'Tasks',
          backgroundColor: '#357edd',
          borderColor: '#357edd'
        },
        {
          id: '2',
          name: 'Meetings',
          backgroundColor: '#fa8c16',
          borderColor: '#fa8c16'
        }
      ]
    });

    const events = {{ events|safe }};
    calendar.createSchedules(events);

    calendar.on('clickSchedule', function(event) {
      const url = event.schedule.raw.url;
      if (url) {
        window.location.href = url;
      }
    });
  });
</script>
