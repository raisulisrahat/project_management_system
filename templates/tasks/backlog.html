{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-between mb-3">
    <div>
        <a href="{% url 'projects' %}" class="text-decoration-none text-dark">Projects</a> /
        <a href="{% url 'project_detail' project.label %}" class="text-decoration-none text-dark">{{ project.name }}</a> /
        <span class="text-muted">Backlog</span>
    </div>
    <a href="{% url 'kanban_board' project.label %}" class="btn btn-outline-secondary btn-sm">← Board</a>
</div>

<h5 class="mb-3">Backlog Tasks</h5>

<div class="list-group shadow-sm">
    {% for task in tasks %}
        <a href="{% url 'task_detail' task.project.label task.unique_id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <div>
                <div class="fw-semibold">{{ task.summary }}</div>
                <small class="text-muted">{{ task.unique_id }}</small>
            </div>
            <img src="{{ task.assigned_to.profile_image.url }}" width="32" height="32" class="rounded-circle" alt="{{ task.assigned_to.full_name }}">
        </a>
    {% empty %}
        <div class="alert alert-warning">No tasks in backlog.</div>
    {% endfor %}
</div>
{% endblock %}
