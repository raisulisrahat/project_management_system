{% extends 'base.html' %}
{% load static %}
{% block title %}Create Task{% endblock %}
 <script src="{% static 'js/jquery-3.7.1.min.js' %}" type="text/javascript"></script>
{% block content %}
<div class="mt-5">
    <p class="fs-6 fw-semibold">Create a new task for <span class="text-primary">{{ project.name }}</span></p>

    <!-- Task Form -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="col-sm-3 form-group mb-4">
            <label for="summary" class="form-label fw-semibold">Summary<span class="text-danger">*</span></label>
            <input class="form-control" type="text" id="summary" name="summary" required>
        </div>
        <div class="col-sm-4 form-group mb-4">
            <label for="description" class="form-label fw-semibold">Description</label>
            <div class="">{{ task_form.description }}</div>
        </div>
        <div class="col-sm-3 form-group mb-4">
            <label for="status" class="form-label fw-semibold">Status<span class="text-danger">*</span></label>
            <select class="form-select" id="status" name="status">
                {% for status in statuses %}
                    <option value="{{ status.id }}" {% if form.instance.status.id == status.id %}selected{% endif %}>{{ status.status_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-sm-3 form-group mb-4">
            <label for="priority" class="form-label fw-semibold">Priority<span class="text-danger">*</span></label>
            <select class="form-select" id="priority" name="priority">
                {% for priority in priorities %}
                    <option value="{{ priority.id }}" {% if form.instance.priority.id == priority.id %}selected{% endif %}>{{ priority.priority_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-sm-3 form-group mb-4">
            <label for="dependencies" class="form-label fw-semibold">Dependencies</label>
            {{ task_form.dependencies }}
        </div>
        <div class="col-sm-3 form-group mb-4">
            <label for="assigned_to" class="form-label fw-semibold">Assigned To</label>
            <div class="d-flex justify-content-sm-between align-items-center">
                <select class="form-control form-select" id="assigned_to" name="assigned_to">
                    <option value="" class="form-control">Unassigned</option>
                    {% for person in peoples %}
                        <option value="{{ person.id }}" data-image="{{ person.profile_image.url }}">
                            {{ person.full_name }}
                        </option>
                    {% endfor %}
                </select>
                <!-- Assign me input -->
                <input type="hidden" name="assign_me" id="assignMeInput" value="false">
            <div class="col-sm-3 mt-sm-3">
                <button type="button" class="btn btn-sm bg-light-subtle shadow-sm" id="assign_me">Assign me</button>
            </div>
            </div>
        </div>
        <div class="col-sm-3 form-group mb-4">
            <label for="reporter" class="form-label fw-semibold">Reporter</label>
            <select class="form-control form-select" name="reporter">
                {% for person in peoples %}
                    <option value="{{ person.id }}" data-image="{{ person.profile_image.url }}">
                        {{ person.full_name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- File upload with custom Browse button and preview -->
        <div class="col-sm-3 form-group mb-4">
            <label for="attachments" class="form-label fw-semibold">Attachments</label>
            <div id="dragDropArea" class="drag-drop-area">
                <span class="fw-semibold">Drag and drop your files here or
                    <!-- Custom Browse button -->
                    <button type="button" id="browseButton" class="btn bg-primary-subtle mt-sm-1 shadow-sm ms-2">Browse</button>
                    <!-- Hidden file input element -->
                    <input type="file" id="fileInput" name="attachments" class="d-none" multiple>
                </span>
            </div>
            <div id="filePreview" class="file-preview"></div>
        </div>
        {{ task_form.media }}
        <!-- Submit button -->
        <div class="form-group">
            <input type="submit" value="Submit" class="btn btn-primary">
        </div>
    </form>
</div>

<!-- JavaScript for file handling and preview -->
<script>

    function formatOption(option) {
        if (!option.id) return option.text;

        const imgUrl = option.element.getAttribute('data-image');
        const text = option.text;

        return $(
            `<span class="form-control form-select"><img src="${imgUrl}" style="width: 30px; height: 30px; border-radius: 50%; ">${text}</span>`
        );
    }

    $(document).ready(function () {
        $('#assigned_to').select2({
            templateResult: formatOption,
            templateSelection: formatOption,
            theme: 'bootstrap-5',
            width: '100%'
        });

        document.getElementById('assign_me').addEventListener('click', function () {
            document.getElementById('assignMeInput').value = 'true';
            const meId = "{{ request.user.profile.id }}";
            $('#assigned_to').val(meId).trigger('change');
        });
    });


const dragDropArea = document.getElementById('dragDropArea');
const browseButton = document.getElementById('browseButton');
const fileInput = document.getElementById('fileInput');
const filePreview = document.getElementById('filePreview');

browseButton.addEventListener('click', function () {
    fileInput.click();
});

fileInput.addEventListener('change', function () {
    handleFiles(fileInput.files);
});

dragDropArea.addEventListener('dragover', function (event) {
    event.preventDefault();
    dragDropArea.classList.add('drag-over');
});

dragDropArea.addEventListener('dragleave', function () {
    dragDropArea.classList.remove('drag-over');
});

dragDropArea.addEventListener('drop', function (event) {
    event.preventDefault();
    dragDropArea.classList.remove('drag-over');
    handleFiles(event.dataTransfer.files);
});

function handleFiles(files) {
    for (let file of files) {
        uploadFile(file);
    }
}

function uploadFile(file) {
    let formData = new FormData();
    formData.append('file', file);

    fetch('/upload-temp-file/', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': getCSRFToken()
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            let preview = document.createElement('div');
            preview.textContent = file.name;
            filePreview.appendChild(preview);
        }
    })
    .catch(error => console.error('Error uploading file:', error));
}

function getCSRFToken() {
    return document.cookie.split('; ').find(row => row.startsWith('csrftoken')).split('=')[1];
}
    // Function to handle files and generate previews
    // Function to handle file previews
function handleFiles(files) {
    filePreview.innerHTML = '';  // Clear previous previews

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const fileName = file.name;
        const fileExtension = fileName.split('.').pop().toLowerCase();

        const previewItem = document.createElement('div');
        previewItem.classList.add('file-preview-item');

        // Show image preview for image files (jpg, jpeg, png, gif, bmp)
        if (['jpg', 'jpeg', 'png', 'gif', 'bmp'].includes(fileExtension)) {
            const image = document.createElement('img');
            image.src = URL.createObjectURL(file);
            image.style.width = '100px';  // Set thumbnail size for images
            image.style.height = 'auto';  // Maintain aspect ratio
            previewItem.appendChild(image);
        }
        // Show PDF thumbnail
        else if (fileExtension === 'pdf') {
            const reader = new FileReader();
            reader.onload = function () {
                const pdfData = new Uint8Array(reader.result);

                // Use PDF.js to render the first page as a thumbnail
                pdfjsLib.getDocument(pdfData).promise.then(function (pdf) {
                    pdf.getPage(1).then(function (page) {
                        const scale = 0.2;  // Adjust scale for the thumbnail size
                        const viewport = page.getViewport({ scale: scale });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        page.render({ canvasContext: context, viewport: viewport }).promise.then(function () {
                            previewItem.appendChild(canvas);
                        });
                    });
                });
            };
            reader.readAsArrayBuffer(file);
        }
        // Show Bootstrap icons for code and other unsupported files
        else {
            const iconContainer = document.createElement('div');
            const fileNameSpan = document.createElement('span');
            fileNameSpan.textContent = ``;

            // Use different Bootstrap icons based on file type
            if (['js', 'html', 'css', 'py', 'java', 'cpp', 'php'].includes(fileExtension)) {
                iconContainer.innerHTML = `<i class="bi bi-file-earmark-code-fill" style="font-size: 2rem;"></i>`;
            } else if (['zip', 'rar', '7z'].includes(fileExtension)) {
                iconContainer.innerHTML = `<i class="bi bi-file-earmark-zip-fill" style="font-size: 2rem;"></i>`;
            } else {
                iconContainer.innerHTML = `<i class="bi bi-file-earmark-fill" style="font-size: 2rem;"></i>`;
            }

            previewItem.appendChild(iconContainer);
            previewItem.appendChild(fileNameSpan);
        }

        // Display the file name
        const fileNameText = document.createElement('div');
        fileNameText.textContent = fileName;
        fileNameText.style.fontSize = '12px';
        previewItem.appendChild(fileNameText);

        filePreview.appendChild(previewItem);
    }
}

</script>
{% endblock %}
