{% extends "base.html" %}
{% block title %}Delete Project{% endblock %}

{% block content %}
<div class="container">
    <h3 class="mb-3">Delete project <strong>{{ project.name }}</strong>?</h3>
    <p>This action is irreversible. Are you sure?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete it</button>
        <a href="{% url 'project_detail' project.label %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
