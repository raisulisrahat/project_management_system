{% extends 'base.html' %}

    {% block title %} {{ user.profile.full_name }} - Profile View {% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="row">
            <div class="col w-25">
                <div class="p-3 bg-white shadow rounded">
                    <img src="{{ user.profile.profile_image.url }}" class="rounded-circle img-fluid mx-auto d-block w-25" alt="{{ user.full_name }}">
                    <p class="">{{ user.profile.full_name }}</p>
                </div>
            </div>
            <div class="col w-75">
                <div class="p-3 bg-white shadow rounded">
                    <p class="">{{ user.full_name }}</p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
