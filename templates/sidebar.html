<div class="sidebar border-end shadow-sm">
    <ul class="list-unstyled p-3">
        <!-- Home link -->
        <li class="py-2">
            <a href="{% url 'dashboard' %}" class="d-flex align-items-center text-decoration-none text-secondary-emphasis">
                <i class="fa-solid fa-house me-2"></i> Home
            </a>
        </li>

        <!-- My tasks link -->
        <li class="py-2">
            <a class="d-flex align-items-center text-decoration-none text-secondary-emphasis" data-bs-toggle="collapse" href="#collapseTask" role="button" aria-expanded="false" aria-controls="collapseTask">
                <i class="fa-solid fa-list-check me-2"></i> My Tasks
            </a>
            <ul class="collapse list-group list-group-flush" id="collapseTask">
                <li class="list-group-item">
                    <a href="" class="dropdown-item text-secondary-emphasis">
                        <i class="fa-solid fa-columns me-2"></i>
                        <span class="eme01">Boards</span>
                    </a>
                </li>
                <li class="list-group-item">
                    <a href="" class="dropdown-item text-secondary-emphasis">
                        <i class="fa-solid fa-bug me-2"></i>
                        <span class="eme01">Issues</span>
                    </a>
                </li>
                <li class="list-group-item">
                    <a href="" class="dropdown-item text-secondary-emphasis">
                        <i class="fa-solid fa-calendar-days me-2"></i>
                        <span class="eme01">Calendar</span>
                    </a>
                </li>
            </ul>
        </li>

        <!-- Messages link -->
        <li class="py-2">
            <a href="#" class="d-flex align-items-center text-decoration-none text-secondary-emphasis">
                <i class="fa-solid fa-message me-2"></i> Messages
            </a>
        </li>

        <!-- Divider -->
        <hr>

        <!-- Projects link (Dropdown) -->
        <li class="py-2">
            <a class="d-flex align-items-center text-decoration-none text-secondary-emphasis" data-bs-toggle="collapse" href="#collapseProject" role="button" aria-expanded="false" aria-controls="collapseProject">
                <i class="fas fa-project-diagram me-2"></i> Projects
            </a>
            <ul class="collapse list-group list-group-flush" id="collapseProject">
                {% for project in projects %}
                <li class="list-group-item">
                    <a href="{% url 'project_detail' project.label %}" class="dropdown-item text-secondary-emphasis">
                        <i class="fa-solid fa-square-caret-right me-2"></i>
                        <span class="eme01">{{ project.label }}</span>
                    </a>
                </li>
                {% endfor %}
                <li class="list-group-item">
                    <a href="{% url 'projects' %}" class="text-decoration-none text-secondary-emphasis">
                        <i class="fa-solid fa-folder-open me-2"></i>
                        <span class="eme01">View Projects</span>
                    </a>
                </li>
            </ul>
        </li>
    </ul>

    <!-- Footer -->
    <div class="sidebar-footer border-top">
        <p class="ms-3 mb-0 fw-semibold">Version 1.0.2</p>
    </div>
</div>
