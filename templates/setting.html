{% extends "base.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
    <div class="p-5 bg-white shadow-sm">
        <h3>General</h3>
    <hr>
        <form class="form-inline p-3 my-2 my-lg-0" method="POST">
            {% csrf_token %}
                <div class="col py-2">
                    <div class="row align-items-center">
                    <div class="col-sm-3">
                        <label for="timezone" class="fw-semibold">Timezone:</label>
                    </div>
                    <div class="col-sm-1">
                        <select name="timezone" id="timezone" class="eme01 form-control">
                            {% for timezone in timezones %}
                                <option value="{{ timezone }}" class="form-select" {% if timezone == current_timezone %}selected{% endif %}>
                                    {{ timezone }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    </div>
                </div>

                <div class="col py-2">
                    <div class="row align-items-center">
                    <div class="col-sm-3">
                        <label for="language" class="fw-semibold">Language:</label>
                    </div>
                    <div class="col-sm-1">
                        <select name="language" class="eme01 form-control" id="language">
                            {% for code, name in languages %}
                                <option value="{{ code }}" class="form-select" {% if code == current_language %}selected{% endif %}>
                                    {{ name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    </div>
                </div>

                <!-- 2FA Enable/Disable Dropdown -->
                <div class="col py-2">
                    <div class="row align-items-center">
                    <div class="col-sm-3">
                        <label for="2fa_state" class="fw-semibold">Two-Factor Authentication (2FA):</label>
                    </div>

                    <div class="col-sm-1">
                        <select name="2fa_state" id="2fa_state" class="eme01 form-control" onchange="toggle2FA(this.value)">
                            <option value="disable" class="form-select" {% if not 2fa_enabled %}selected{% endif %}>Disable</option>
                            <option value="enable" class="form-select" {% if 2fa_enabled %}selected{% endif %}>Enable</option>
                        </select>
                    </div>
                    </div>
                </div>
            <div class="py-4">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </form>
    </div>

    <!-- 2FA Modal for QR Code and Token -->
    <div id="2fa-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close" onclick="close2FAModal()">&times;</span>
            <h3>Enable Two-Factor Authentication</h3>
            <p>Scan the QR code with your authenticator app:</p>
            <img src="data:image/png;base64,{{ qr_code_data }}" alt="QR Code" class="w-25 h-25 mx-auto"/>

            <form method="POST" enctype="multipart/form-data" class="m-3">
                {% csrf_token %}
                <input type="hidden" name="2fa_state" value="enable" class="form-control">
                <div class="row">
                    <div class="col-sm-8">
                        <input type="text" name="token" placeholder="Enter 2FA Code" class="form-control" required />
                    </div>
                    <div class="col-sm-4">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </div>
                {% if 2fa_error %}
                    <p class="text-danger">{{ 2fa_error }}</p>
                {% endif %}
            </form>
        </div>
    </div>

    <!-- Modal CSS -->
    <style>
        .modal {
            display: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1030;
            background-color: white;
            padding: 20px;
            border: 2px solid #ccc;

        }
        .modal-content {
            padding: 20px;
            text-align: center;
            align-items: center;

        }
        .close {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 24px;
        }
    </style>

    <!-- JavaScript to Show/Hide Modal -->
    <script>
        function toggle2FA(value) {
            if (value === 'enable') {
                document.getElementById('2fa-modal').style.display = 'block';
            } else {
                close2FAModal();
            }
        }

        function close2FAModal() {
            document.getElementById('2fa-modal').style.display = 'none';
        }

        // Automatically show the modal if it's enabled (for page reload after submission)
        {% if show_modal %}
            document.getElementById('2fa-modal').style.display = 'block';
        {% endif %}
    </script>
{% endblock %}
